<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">MethaneClause architecture: evidence, verdict, money</title>
<desc id="arch-desc">Carbon Mapper and UNEP IMEO MARS feed k independent observer organisations, each running Fetch, Validate, Seal, Sign and Re-check. Signed hashes go on chain to KeyRegistry, MethaneCovenant (bond, k-of-n, challenge window, rebate) and IncentivePool (qualified clean passes, capped refund installments, cancelled by the next attested detection). Money moves between seller, buyer and sponsor; a verdict-only covenant settles by credit note. Raw data stays off chain. Dashed red lines are trust boundaries TB1 to TB5. On Ethereum Sepolia: the core, the registry and the pool with its five libraries, Etherscan-verified; SuretyBond runs on a local chain only.</desc>
<style>
  svg { --bg:#ffffff; --ink:#1f2328; --muted:#59636e; --line:#6e7781; --off:#f6f8fa; --offb:#d1d9e0; --card:#ffffff; --card2:#e6eaef;
        --on:#ddf4ff; --onb:#0969da; --tb:#cf222e; --money:#1a7f37; --pcf:#ddf4ff; --pct:#0550ae; --plf:#fff8c5; --plt:#7d4e00; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#0d1117; --ink:#e6edf3; --muted:#9198a1; --line:#8b949e; --off:#151b23; --offb:#3d444d; --card:#0d1117; --card2:#262c36;
          --on:#0b2245; --onb:#4493f8; --tb:#ff7b72; --money:#3fb950; --pcf:#0b2245; --pct:#79c0ff; --plf:#2e2306; --plt:#e3b341; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .bg { fill: var(--bg); }
  .t { font-size: 18px; font-weight: 700; }
  .k { font-size: 11px; font-weight: 700; letter-spacing: .06em; fill: var(--muted); }
  .h { font-size: 14px; font-weight: 700; }
  .d { font-size: 12px; }
  .s { font-size: 11px; fill: var(--muted); }
  .n { font-size: 11px; font-weight: 700; fill: var(--bg); text-anchor: middle; }
  .zoff { fill: var(--off); stroke: var(--offb); stroke-width: 1; }
  .zon { fill: var(--on); stroke: var(--tb); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .box { fill: var(--card); stroke: var(--line); stroke-width: 1; }
  .box2 { fill: var(--card2); stroke: var(--line); stroke-width: 1; }
  .box3 { fill: var(--card); stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 3; }
  .chain { fill: var(--card); stroke: var(--onb); stroke-width: 1.5; }
  .tbbox { fill: var(--card); stroke: var(--tb); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .tb { stroke: var(--tb); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
  .arr { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .money { stroke: var(--money); stroke-width: 2.2; fill: none; }
  .ah { fill: var(--line); }
  .am { fill: var(--money); }
  .dot { fill: var(--ink); }
  .rail { stroke: var(--line); stroke-width: 1; }
  .pc { fill: var(--pcf); stroke: var(--onb); stroke-width: 1; }
  .pct { font-size: 10.5px; font-weight: 600; fill: var(--pct); text-anchor: middle; }
  .pl { fill: var(--plf); stroke: var(--plt); stroke-width: 1; }
  .plt { font-size: 10.5px; font-weight: 600; fill: var(--plt); text-anchor: middle; }
  .mt { font-size: 11px; font-weight: 700; fill: var(--money); }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
  <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="am"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="1120" height="640" rx="14"/>

<!-- title and legend -->
<text class="t" x="24" y="36">MethaneClause: evidence → verdict → money</text>
<line class="tb" x1="470" y1="31" x2="500" y2="31"/>
<text class="s" x="506" y="35">trust boundary (TB1–TB5)</text>
<line class="money" x1="648" y1="31" x2="676" y2="31" marker-end="url(#am)"/>
<text class="s" x="684" y="35">money</text>
<rect class="pc" x="728" y="22" width="104" height="18" rx="9"/><text class="pct" x="780" y="35">Sepolia + local</text>
<rect class="pl" x="842" y="22" width="104" height="18" rx="9"/><text class="plt" x="894" y="35">local chain only</text>
<text class="s" x="958" y="35">[SIM] simulated</text>

<!-- zones -->
<rect class="zoff" x="16" y="56" width="504" height="568" rx="10"/>
<text class="k" x="32" y="78">OFF CHAIN · RAW DATA STAYS WITH PROVIDERS AND OBSERVERS</text>
<rect class="zon" x="536" y="56" width="300" height="568" rx="10"/>
<text class="k" x="552" y="78">ON CHAIN · HASHES, SIGNATURES, MONEY</text>
<text class="k" x="852" y="78">PARTIES AND READERS</text>

<!-- column 1: providers -->
<rect class="box2" x="32" y="96" width="180" height="48" rx="6"/>
<text class="h" x="44" y="116">Satellite sensors</text>
<text class="d" x="44" y="134">Tanager · EMIT · others</text>
<line class="tb" x1="26" y1="156" x2="216" y2="156"/>
<text class="s" x="32" y="172">TB1 sensor and space link:</text>
<text class="s" x="32" y="186">the provider's trust</text>
<line class="arr" x1="200" y1="146" x2="200" y2="197" marker-end="url(#ah)"/>

<rect class="box" x="32" y="200" width="180" height="76" rx="6"/>
<text class="h" x="44" y="222">Carbon Mapper</text>
<text class="d" x="44" y="242">plumes · sources · scenes</text>
<text class="d" x="44" y="260">keyless API, unsigned</text>

<rect class="box" x="32" y="292" width="180" height="76" rx="6"/>
<text class="h" x="44" y="314">UNEP IMEO MARS</text>
<text class="d" x="44" y="334">plume rows · source labels</text>
<text class="d" x="44" y="352">public zip, pinned SHA-256</text>

<rect class="box3" x="32" y="392" width="180" height="92" rx="6"/>
<text class="h" x="44" y="414">Registries</text>
<text class="d" x="44" y="434">MiQ, JOGMEC CLEAN and</text>
<text class="d" x="44" y="452">UNEP MARS certify, notify;</text>
<text class="d" x="44" y="470">they stay inputs</text>

<!-- TB2 -->
<line class="tb" x1="223" y1="196" x2="223" y2="604"/>
<text class="s" transform="translate(237,604) rotate(-90)">TB2 provider APIs, unsigned</text>
<line class="arr" x1="212" y1="238" x2="239" y2="238" marker-end="url(#ah)"/>
<line class="arr" x1="212" y1="330" x2="239" y2="330" marker-end="url(#ah)"/>

<!-- column 2: observers -->
<text class="h" x="242" y="104">k independent observers</text>
<text class="s" x="242" y="122">distinct organisations, e.g. A · B · C,</text>
<text class="s" x="242" y="137">or your own wallet (OBS_JUDGE)</text>
<rect class="box2" x="254" y="148" width="246" height="310" rx="8"/>
<rect class="box2" x="248" y="154" width="246" height="310" rx="8"/>
<rect class="tbbox" x="242" y="160" width="246" height="310" rx="8"/>
<line class="rail" x1="262" y1="186" x2="262" y2="402"/>
<circle class="dot" cx="262" cy="186" r="10"/><text class="n" x="262" y="190">1</text>
<text class="h" x="280" y="191">Fetch</text>
<text class="d" x="280" y="207">provider response, kept with</text>
<text class="d" x="280" y="221">its SHA-256 as the receipt</text>
<circle class="dot" cx="262" cy="240" r="10"/><text class="n" x="262" y="244">2</text>
<text class="h" x="280" y="245">Validate</text>
<text class="d" x="280" y="261">bad input refused before</text>
<text class="d" x="280" y="275">anything is signed</text>
<circle class="dot" cx="262" cy="294" r="10"/><text class="n" x="262" y="298">3</text>
<text class="h" x="280" y="299">Seal</text>
<text class="d" x="280" y="315">RFC 8785 JCS → SHA-256:</text>
<text class="d" x="280" y="329">evidenceHash · sceneHash</text>
<circle class="dot" cx="262" cy="348" r="10"/><text class="n" x="262" y="352">4</text>
<text class="h" x="280" y="353">Sign</text>
<text class="d" x="280" y="369">EIP-712 ECDSA, checked on chain</text>
<text class="d" x="280" y="383">+ ML-DSA-44, checked off chain</text>
<circle class="dot" cx="262" cy="402" r="10"/><text class="n" x="262" y="406">5</text>
<text class="h" x="280" y="407">Re-check</text>
<text class="d" x="280" y="423">re-fetch and compare;</text>
<text class="d" x="280" y="437">DIFFERS → no signature</text>
<text class="s" x="254" y="460">TB3 each organisation's own host and keys</text>
<text class="d" x="242" y="492">k identical bundles → k signatures</text>
<text class="d" x="242" y="510">over one hash; disagreement → no quorum</text>
<text class="d" x="242" y="528">raw responses and receipts stay here</text>

<!-- observers to chain (crossing TB4) -->
<path class="arr" d="M 500 262 C 522 262, 528 280, 549 280" marker-end="url(#ah)"/>
<path class="arr" d="M 500 400 C 522 400, 528 440, 549 440" marker-end="url(#ah)"/>

<!-- column 3: on chain -->
<text class="s" x="552" y="96">TB4 any wallet submits: proposer, challenger,</text>
<text class="s" x="552" y="110">sponsor; the contract re-checks every signature</text>

<rect class="chain" x="552" y="128" width="268" height="72" rx="6"/>
<rect class="pc" x="712" y="119" width="100" height="18" rx="9"/><text class="pct" x="762" y="132">Sepolia + local</text>
<text class="h" x="566" y="152">KeyRegistry</text>
<text class="d" x="566" y="172">orgs · roles · rotation · revocation</text>
<text class="d" x="566" y="190">ML-DSA-44 key hash (the anchor)</text>

<line class="arr" x1="600" y1="221" x2="600" y2="203" marker-end="url(#ah)"/>
<text class="s" x="608" y="215">keys valid now</text>

<rect class="chain" x="552" y="222" width="268" height="128" rx="6"/>
<rect class="pc" x="712" y="213" width="100" height="18" rx="9"/><text class="pct" x="762" y="226">Sepolia + local</text>
<text class="h" x="566" y="246">MethaneCovenant (the core)</text>
<text class="d" x="566" y="266">seller's bond for named sources</text>
<text class="d" x="566" y="284">k distinct orgs, never seller or buyer</text>
<text class="d" x="566" y="302">challenge window → CONFIRMED / VOID</text>
<text class="d" x="566" y="320">rebate to the buyer (pull payment)</text>
<text class="d" x="566" y="338">policyHash fixed before evidence</text>

<line class="arr" x1="600" y1="387" x2="600" y2="353" marker-end="url(#ah)"/>
<text class="s" x="608" y="372">reads the core, never writes it</text>

<rect class="chain" x="552" y="388" width="268" height="138" rx="6"/>
<rect class="pc" x="712" y="379" width="100" height="18" rx="9"/><text class="pct" x="762" y="392">Sepolia + local</text>
<text class="h" x="566" y="412">IncentivePool</text>
<text class="d" x="566" y="431">a claim opens on a confirmed episode</text>
<text class="d" x="566" y="448">k-of-n qualified clean passes</text>
<text class="d" x="566" y="465">→ capped refund installments;</text>
<text class="d" x="566" y="482">the next attested detection</text>
<text class="d" x="566" y="499">cancels what is still unpaid</text>
<text class="s" x="566" y="516">+ five linked libraries</text>

<line class="money" x1="600" y1="528" x2="600" y2="546" marker-end="url(#am)"/>

<rect class="chain" x="552" y="550" width="268" height="50" rx="6"/>
<rect class="pl" x="708" y="541" width="104" height="18" rx="9"/><text class="plt" x="760" y="554">local chain only</text>
<text class="h" x="566" y="571">SuretyBond</text>
<text class="d" x="566" y="589">a surety posts the bond, gets refunds</text>
<text class="s" x="552" y="616">Sepolia: core, registry, pool + libraries; verified</text>

<!-- column 4: parties -->
<rect class="box3" x="852" y="104" width="252" height="80" rx="6"/>
<text class="h" x="866" y="126">Verdict-only covenant [SIM]</text>
<text class="d" x="866" y="146">where crypto payments are not lawful:</text>
<text class="d" x="866" y="164">CONFIRMED → credit note (off chain)</text>
<path class="arr" d="M 820 238 C 836 238, 836 170, 850 168" marker-end="url(#ah)"/>

<rect class="box" x="852" y="204" width="252" height="76" rx="6"/>
<text class="h" x="866" y="226">Buyer [SIM]</text>
<text class="d" x="866" y="246">an EU gas importer's methane desk</text>
<text class="d" x="866" y="264">receives the rebate from the bond</text>
<line class="money" x1="822" y1="262" x2="849" y2="256" marker-end="url(#am)"/>

<rect class="box" x="852" y="300" width="252" height="76" rx="6"/>
<text class="h" x="866" y="322">Seller [SIM]</text>
<text class="d" x="866" y="342">posts the bond for named sources</text>
<text class="d" x="866" y="360">receives capped refund installments</text>
<line class="money" x1="851" y1="318" x2="823" y2="330" marker-end="url(#am)"/>
<path class="money" d="M 822 420 C 838 420, 838 372, 849 368" marker-end="url(#am)"/>

<rect class="box" x="852" y="396" width="252" height="76" rx="6"/>
<text class="h" x="866" y="418">Sponsor [SIM]</text>
<text class="d" x="866" y="438">a lender whose margin moves on</text>
<text class="d" x="866" y="456">methane, or the buyer: funds the pool</text>
<line class="money" x1="851" y1="446" x2="823" y2="462" marker-end="url(#am)"/>

<rect class="tbbox" x="852" y="496" width="252" height="96" rx="6"/>
<text class="h" x="866" y="518">TB5 your browser</text>
<text class="d" x="866" y="538">the page re-checks every hash and</text>
<text class="d" x="866" y="556">both signatures locally</text>
<text class="s" x="866" y="576">regulator · lender · auditor</text>
</svg>
