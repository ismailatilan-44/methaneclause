<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">MethaneClause: two money arrows</title>
  <desc id="d">Public satellite records are the evidence; independent witnesses, separate organisations, each fetch the record and sign it. Red arrow: when enough witnesses sign the same leak and the appeal window passes, the seller's bond pays the rebate to the buyer. Green arrow: when later satellite passes show no new leak, the sponsor's earn-back pool pays the seller back in steps, never more than the rebate; a new confirmed leak cancels the unpaid steps. Once enough witnesses sign a sighting, no one can delete it.</desc>
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; }
    .box { fill: #f6f8fa; stroke: #8c959f; }
    .ev { fill: #f6f8fa; stroke: #8c959f; stroke-dasharray: 8 5; }
    .h { fill: #1f2328; font-weight: 600; font-size: 30px; }
    .s { fill: #59636e; font-size: 28px; }
    .red { stroke: #cf222e; fill: none; }
    .redt { fill: #cf222e; font-weight: 700; font-size: 28px; }
    .redf { fill: #cf222e; }
    .green { stroke: #1a7f37; fill: none; }
    .greent { fill: #1a7f37; font-weight: 700; font-size: 28px; }
    .greenf { fill: #1a7f37; }
    .look { stroke: #59636e; fill: none; stroke-dasharray: 5 6; stroke-width: 2.5; }
    .lookf { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #3d444d; }
      .box, .ev { fill: #151b23; stroke: #656c76; }
      .h { fill: #f0f6fc; }
      .s { fill: #9198a1; }
      .red { stroke: #ff7b72; } .redt, .redf { fill: #ff7b72; }
      .green { stroke: #3fb950; } .greent, .greenf { fill: #3fb950; }
      .look { stroke: #9198a1; } .lookf { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" orient="auto"><path class="redf" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" orient="auto"><path class="greenf" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path class="lookf" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="card" x="1" y="1" width="898" height="518" rx="14"/>

  <!-- evidence: satellites -> witnesses -->
  <rect class="ev" x="40" y="20" width="320" height="100" rx="10"/>
  <text class="h" x="200" y="62" text-anchor="middle">Satellites</text>
  <text class="s" x="200" y="100" text-anchor="middle">public records</text>
  <path class="look" d="M366,70 L494,70" marker-end="url(#ak)"/>
  <rect class="box" x="500" y="20" width="360" height="100" rx="10"/>
  <text class="h" x="680" y="62" text-anchor="middle">Witnesses</text>
  <text class="s" x="680" y="100" text-anchor="middle">each fetch and sign</text>
  <path class="look" d="M580,124 L285,262" marker-end="url(#ak)"/>
  <path class="look" d="M700,124 L640,262" marker-end="url(#ak)"/>
  <text class="s" x="380" y="176" text-anchor="middle">clean passes</text>
  <text class="s" x="690" y="200">a leak</text>

  <!-- parties -->
  <rect class="box" x="5" y="270" width="180" height="150" rx="10"/>
  <text class="h" x="95" y="310" text-anchor="middle">Sponsor</text>
  <text class="s" x="95" y="346" text-anchor="middle">funds the</text>
  <text class="s" x="95" y="378" text-anchor="middle">earn-back</text>
  <text class="s" x="95" y="410" text-anchor="middle">pool</text>

  <rect class="box" x="360" y="270" width="180" height="150" rx="10"/>
  <text class="h" x="450" y="310" text-anchor="middle">Seller</text>
  <text class="s" x="450" y="346" text-anchor="middle">posts</text>
  <text class="s" x="450" y="378" text-anchor="middle">a bond</text>

  <rect class="box" x="715" y="270" width="180" height="150" rx="10"/>
  <text class="h" x="805" y="310" text-anchor="middle">Buyer</text>
  <text class="s" x="805" y="346" text-anchor="middle">gets</text>
  <text class="s" x="805" y="378" text-anchor="middle">the rebate</text>

  <!-- green: sponsor -> seller; red: seller -> buyer; labels clear of the arrowheads -->
  <path class="green" stroke-width="7" d="M189,360 L352,360" marker-end="url(#ag)"/>
  <text class="greent" x="272" y="332" text-anchor="middle">earn-back</text>
  <path class="red" stroke-width="7" d="M544,360 L707,360" marker-end="url(#ar)"/>
  <text class="redt" x="627" y="332" text-anchor="middle">rebate</text>

  <text class="s" x="450" y="464" text-anchor="middle">A new confirmed leak cancels the unpaid steps.</text>
  <text class="s" x="450" y="500" text-anchor="middle">Once enough witnesses sign, no one can delete it.</text>
</svg>
